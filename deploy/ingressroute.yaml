# Two backends: the Rust API behind /api/* (Service agent-reports) and the
# static nginx image for everything else (Service agent-reports-web). Traefik
# sends /api/* only to Rust; nginx never proxies.
#
# Traefik only routes. Sign-in and the session cookie check live in the Rust
# server; no secret value appears in any Traefik object.
# Route order is by explicit priority, not YAML order (higher wins):
#   110 login     -> /api/login to Rust behind the per-client login limit.
#   100 API       -> every other /api/* to Rust, which checks the cookie.
#    10 catch-all -> nginx: SPA shell, render runtime, assets, share pages.
#                    Public build output; holds no data.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: agent-reports
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`${AGENT_REPORTS_HOST}`) && Path(`/api/login`)
      kind: Rule
      priority: 110
      middlewares:
        - name: agent-reports-login-limit
      services:
        - name: agent-reports
          port: 80
    - match: Host(`${AGENT_REPORTS_HOST}`) && PathPrefix(`/api/`)
      kind: Rule
      priority: 100
      services:
        - name: agent-reports
          port: 80
    - match: Host(`${AGENT_REPORTS_HOST}`)
      kind: Rule
      priority: 10
      services:
        - name: agent-reports-web
          port: 80
  tls:
    secretName: agent-reports-tls
