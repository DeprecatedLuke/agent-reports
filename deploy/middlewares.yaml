# Caps requests on the /api/login route only (priority 110). The cluster's
# Traefik Service uses `externalTrafficPolicy: Local`, so Traefik sees the real
# client address and the default per-source bucket is per client. A signed-in
# browser carries the session cookie and never needs /api/login again.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: agent-reports-login-limit
spec:
  rateLimit:
    average: 20
    period: 1m
    burst: 20
