# Secret templated by `task apply` (envsubst); never commit real values.
# Read only by the Rust server (Deployment env); Traefik never sees it.
#   htpasswd:       one bcrypt `user:hash` line generated from
#                   AGENT_REPORTS_BASIC_AUTH_USER/PASSWORD (checked by /api/login)
#   session-token:  value of the __Host-agent-reports cookie
apiVersion: v1
kind: Secret
metadata:
  name: agent-reports-auth
type: Opaque
stringData:
  htpasswd: '${AGENT_REPORTS_HTPASSWD}'
  session-token: '${AGENT_REPORTS_SESSION_TOKEN}'
