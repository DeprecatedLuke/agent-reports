apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-reports-web
  labels:
    app: agent-reports-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-reports-web
  template:
    metadata:
      labels:
        app: agent-reports-web
    spec:
      imagePullSecrets:
        - name: ${AGENT_REPORTS_PULL_SECRET}
      securityContext:
        runAsNonRoot: true
        # nginx-unprivileged's nginx user.
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # Placeholder: deploy/kustomization.yaml sets ${AGENT_REPORTS_REGISTRY}/agent-reports-web:<pinned tag>.
          image: agent-reports-web
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # readOnlyRootFilesystem: nginx writes its pid file and temp files here.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: agent-reports-web
  labels:
    app: agent-reports-web
spec:
  type: ClusterIP
  selector:
    app: agent-reports-web
  ports:
    - name: http
      port: 80
      targetPort: http
