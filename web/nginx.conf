# Static frontend for agent-reports: the Svelte SPA, the report iframe runtime and the
# share shell. The Rust server (plan: `server`) is only reached through Traefik under
# `/api`; nothing here proxies.
#
# Installed as /etc/nginx/conf.d/default.conf of nginxinc/nginx-unprivileged:alpine-slim
# (uid 101, writes only /tmp). This file is included in the `http` block, so top-level
# `map`s are legal.

# Report documents are loaded in a sandboxed iframe with an opaque origin, so module
# scripts and fonts are fetched in CORS mode. Reflect the requested headers in the
# preflight, falling back to `*`.
map $http_access_control_request_headers $agent_reports_cors_headers {
	default $http_access_control_request_headers;
	""      "*";
}

# Only the runtime entry points change without a new URL; everything else is content
# addressed by the ?v= version hash the server stamps into the report document.
map $uri $agent_reports_render_cache {
	default                            "public, max-age=31536000, immutable";
	~^/_render/(runtime\.js|report\.css)$ "no-cache";
}

server {
	listen 8080;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;
	autoindex off;
	server_tokens off;

	# Report runtime: /usr/share/nginx/render (render/dist).
	# The sandboxed iframe has an opaque origin, so every response needs the CORS header,
	# including the 404 for a missing file.
	location /_render/ {
		alias /usr/share/nginx/render/;
		autoindex off;

		add_header Access-Control-Allow-Origin "*" always;
		add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
		add_header Access-Control-Allow-Headers $agent_reports_cors_headers always;
		add_header Access-Control-Max-Age "86400" always;
		add_header Cache-Control $agent_reports_render_cache always;

		if ($request_method = OPTIONS) {
			return 204;
		}
	}

	# Hashed SPA bundle; a miss is a 404, never the shell.
	location /assets/ {
		alias /usr/share/nginx/html/assets/;
		autoindex off;
		add_header Cache-Control "public, max-age=3600" always;
	}

	location = /favicon.svg {
		add_header Cache-Control "public, max-age=300" always;
	}

	# Share shell: the token is validated by /api/s/{token}/meta in the page, so any
	# well-formed token gets the shell and paints its own not-found/expired state.
	location ~ ^/s/[^/]+/?$ {
		add_header Cache-Control "no-cache" always;
		try_files /share.html =404;
	}

	# Pod probes only.
	location = /healthz {
		access_log off;
		return 204;
	}

	# SPA fallback: unknown paths render the app, which routes them client side.
	location / {
		add_header Cache-Control "no-cache" always;
		try_files $uri /index.html;
	}
}
