# Caps requests on the /api/login route only (priority 110). The cluster's
# Traefik Service uses `externalTrafficPolicy: Local`, so Traefik sees the real
# client address and the default per-source bucket is per client. A signed-in
# browser carries the session cookie and never needs /api/login again.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: agent-reports-login-limit
spec:
  rateLimit:
    average: 20
    period: 1m
    burst: 20
---
# Traefik asks the API before serving an app page: `/api/guard` answers 204 when the
# `Cookie` header carries a valid session, so nginx never hands out the SPA shell to a
# browser that is not signed in. A 302 from the guard goes straight to the browser, which
# lands on /api/login and then back on the requested page. The check reads only the
# cookie the server minted; no secret here.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: agent-reports-guard
spec:
  forwardAuth:
    address: http://agent-reports.${AGENT_REPORTS_NAMESPACE}.svc.cluster.local/api/guard
    authRequestHeaders:
      - Cookie
